name: live
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - run: sudo apt-get install -y -qq libcurl4-openssl-dev
      - run: Rscript -e 'install.packages(c("curl","jsonlite"))'
      - run: R CMD build . && R CMD check --no-manual veida_0.1.0.tar.gz
      - run: R CMD INSTALL . && Rscript -e 'img <- veida::veida_generate("a paper boat on a calm lake at sunrise, soft light", "16:9"); print(img$url); stopifnot(startsWith(img$url, "https://"))'
